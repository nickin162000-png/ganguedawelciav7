name: Gerar .jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Instalar Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> $GITHUB_PATH

      - name: Compilar
        run: gradle setupCIWorkspace build --no-daemon

      - name: Guardar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: GangueDaWelcia-jar
          path: build/libs/*.jar
